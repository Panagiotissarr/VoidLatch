[package]
name = "minecraft-injector"
version = "1.0.0"
edition = "2021"
description = "VoidLatch by pana"

[dependencies]
egui = "0.29.0"
eframe = "0.29.0"
log = "0.4.25"
simplelog = "0.12.2"
anyhow = "1.0"
thiserror = "2.0"
sysinfo = "0.37.2"
rfd = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ptrace-inject = "0.1.2"
proc-maps = "0.4.0"

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
